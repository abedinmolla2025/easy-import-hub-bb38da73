<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Noor — Islamic App for Quran, Hadith, Prayer Times & Dua</title>
    <meta name="description" content="Noor is a free Islamic app for Bengali Muslims in India & Bangladesh. Read Quran with Bengali translation, authentic Hadith (Bukhari, Muslim), daily Duas, accurate Prayer Times, Qibla finder & Islamic quiz." />
    <link rel="canonical" href="https://noorapp.in/" />
    <meta name="author" content="NOOR" />
    <meta name="theme-color" content="#0d9f6e" />
    <meta name="msvalidate.01" content="BD28A1AD6076D784011352F0CB5D0B75" />
    <!-- Static fallback manifest; overridden dynamically by GlobalConfigContext -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Premium Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Bengali:wght@400;500;600;700&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@300;400;500;600;700;800;900&family=Cormorant+Garamond:wght@400;500;600;700&family=Crimson+Pro:wght@300;400;500;600;700&family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- OG & canonical tags are dynamically injected by react-helmet-async per route -->
    <!-- Do NOT hardcode canonical or OG here — it overrides page-specific values -->
    <!-- Static fallback OG tags so social crawlers (WhatsApp, Telegram, Slack) that don't execute JS or skip prerender still get the app's own logo, not a generic icon. Per-route values from react-helmet-async / prerender will override these when present. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Noor Islamic App" />
    <meta property="og:title" content="Noor — Islamic App for Quran, Hadith, Prayer Times & Dua" />
    <meta property="og:description" content="Free Islamic app for Bengali Muslims: Quran with Bengali translation, authentic Hadith, daily Duas, Prayer Times, Qibla & Islamic quiz." />
    <meta property="og:image" content="https://noorapp.in/og-image.png" />
    <meta property="og:image:secure_url" content="https://noorapp.in/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Noor Islamic App" />
    <meta property="og:url" content="https://noorapp.in/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Noor — Islamic App for Quran, Hadith, Prayer Times & Dua" />
    <meta name="twitter:description" content="Free Islamic app for Bengali Muslims: Quran with Bengali translation, authentic Hadith, daily Duas, Prayer Times, Qibla & Islamic quiz." />
    <meta name="twitter:image" content="https://noorapp.in/og-image.png" />

    <!-- Google Consent Mode v2 — default denied until user consents -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){ dataLayer.push(arguments); }
      window.gtag = gtag;
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted',
        wait_for_update: 500
      });
      try {
        var c = localStorage.getItem('noor_cookie_consent');
        if (c) {
          var parsed = c === 'accepted' ? { ad: 'granted', an: 'granted' }
            : c === 'rejected' ? { ad: 'denied', an: 'denied' }
            : JSON.parse(c);
          gtag('consent', 'update', {
            ad_storage: parsed.ad === 'granted' ? 'granted' : 'denied',
            ad_user_data: parsed.ad === 'granted' ? 'granted' : 'denied',
            ad_personalization: parsed.ad === 'granted' ? 'granted' : 'denied',
            analytics_storage: parsed.an === 'granted' ? 'granted' : 'denied'
          });
        }
      } catch (e) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(reg => {
            console.log('SW registered:', reg.scope);
          }).catch(err => {
            console.warn('SW registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
